<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurex AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Archivo+Black&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="body-container">
        <aside class="sidebar">

            <div class="logo">
                <h2> AUREX </h2>
            </div>

            <button class="newChat-btn">
                New Chat
            </button>

            <div class="chat-history">

                <h3> Recent Chats </h3>
                <ul>
                    <li>

                    </li>
                </ul>

            </div>
        </aside>

        <main class="main-chat">
            <div class="welcome-section">

                <h1> Welcome To Aurex </h1>
                <p>
                    How can I help you today?
                </p>

            </div>

            <div class="chat-messages">
            </div>

            <div class="chatInput-area">

                <div class="chatInput-box">
                    <input type="text" placeholder="Message Aurex..." id="userInput">

                    <button id="sendBtn">Send</button>
                </div>

            </div>

        </main>
    </div>













    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="Js/app.js"></script>
</body>

</html>
